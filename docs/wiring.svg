<text x="780" y="732" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7680">Leads are 30 AWG. Each comes up through the hole at the dot, lies in the</text>
<text x="780" y="749" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7680">groove under its sticker, and runs in the underside channels to the MPR121.</text>
<text x="780" y="766" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7680">From the front, ELE0 is the top-left pad and the boards are bottom right.</text>
<text x="780" y="783" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7680">3Vo, ADDR and the GND beside ELE0 stay unconnected. The XIAO pins are from memory:</text>
<text x="780" y="800" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7680">check them against its silkscreen.</text>
